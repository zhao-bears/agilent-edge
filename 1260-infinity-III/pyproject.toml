[project]
name = "1260-infinity-iii-edge"
version = "0.1.0"
description = "PUDA edge service for the Agilent 1260 Infinity III LC"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "puda>=0.0.18",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "moses-hplc>=1.0.0",
    "pythonnet>=3.0.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "bidict>=0.23",
    "pymassspec>=2.5",
    "agilent-decode",
]
